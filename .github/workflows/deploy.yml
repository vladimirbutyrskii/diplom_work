name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 84.201.129.11 >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: ssh ubuntu@84.201.129.11 "echo 'SSH connection successful'"

      - name: Deploy to server
        run: |
          ssh ubuntu@84.201.129.11 "cd diplom && git pull origin develop && docker compose -f docker-compose.prod.yml down && docker compose -f docker-compose.prod.yml up --build -d && docker compose -f docker-compose.prod.yml exec -T app python manage.py migrate --noinput && docker compose -f docker-compose.prod.yml exec -T app python manage.py collectstatic --noinput"
